[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quaderno"
version = "0.1.0"
description = "Quaderno di note da riga di comando"
readme = "README.md"
requires-python = ">=3.11"

[project.scripts]
quaderno = "quaderno.cli:esegui"

[tool.setuptools.packages.find]
where = ["src"]
